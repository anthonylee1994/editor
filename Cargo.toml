# External crates
aho-corasick = "1.1"
any_vec = "0.14"
anyhow = "1"
async-channel = { version = "2.5", default-features = false }
async-lock = { version = "3.4", default-features = false }
async-task = "4.7"
async-trait = "0.1"
base64 = "0.22"
bitflags = "2.6.0"
block2 = "0.6"
clap = { version = "4.4", features = ["derive", "wrap_help"] }
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
dirs = "6.0"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
encoding_rs = "0.8"
etagere = "0.2"
futures = "0.3.34"
globset = "0.4"
heapless = "0.9.2"
ignore = "0.4.22"
# Only the formats the editor decodes; see `gpui::ImageFormat`.
image = { version = "0.25.1", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
imara-diff = { version = "0.2", default-features = false }
indexmap = { version = "2.7.0", features = ["serde"] }
itertools = "0.15"
libc = "0.2"
linkify = "0.10.0"
log = { version = "0.4", default-features = false, features = ["std"] }
lru = "0.19"
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGColorSpace", "std"] }
objc2-foundation = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSArray",
    "NSAttributedString",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
    "std",
  ]
}
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "CAMetalDisplayLink", "CAMetalLayer", "std"] }
ordered-float = "5"
parking_lot = "0.12.1"
proc-macro2 = "1.0.93"
quote = "1.0.9"
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "sys_rng"] }
raw-window-handle = "0.6"
rayon = "1.8"
regex = { version = "1.5", default-features = false, features = ["perf", "std"] }
rust-embed = { version = "8.11", features = ["compression", "include-exclude"] }
rustc-hash = "2"
serde = { version = "1", features = ["rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
shellexpand = "3.1"
shlex = "2.0"
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["const_new", "union"] }
strum = { version = "0.28", features = ["derive"] }
syn = { version = "2.0", default-features = false, features = ["proc-macro"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
time = {
  version = "0.3",
  features = [
    "formatting",
    "local-offset",
    "macros",
    "parsing",
    "serde",
    "serde-well-known",
  ]
}
tree-sitter = "0.27.1"
unicase = "2.6"
unicode-segmentation = "1.10"
url = "2.2"
urlencoding = "2.1.2"
usvg = { version = "0.48.1", default-features = false }
uuid = { version = "1.1", features = ["serde"] }

[workspace.lints.clippy]
absolute_paths = "warn"
alloc_instead_of_core = "warn"
as_pointer_underscore = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
assertions_on_result_states = "warn"
assigning_clones = "warn"
borrow_as_ptr = "warn"
branches_sharing_code = "warn"

# nursery
missing_const_for_fn = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"

# pedantic
cast_possible_wrap = "warn"
cast_ptr_alignment = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
collapsible_else_if = "warn"
comparison_chain = "warn"
copy_iterator = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
duration_suboptimal_units = "warn"
elidable_lifetime_names = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
wildcard_imports = "warn"

# cargo
# multiple_crate_versions = "warn" # third party lib may depdends on old ones, maybe in future we should just vendor or bring our own
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"

# old lint rules
large_enum_variant = "allow"  # We often have large enum variants yet we rarely actually bother with splitting them up.
single_range_in_vec_init = "allow"  # Motivation: We use `vec![a..b]` a lot when dealing with ranges in text, so warning on this rule produces a lot of noise.
too_many_arguments = "allow"  # in Rust it can be very tedious to reduce argument count without running afoul of the borrow checker.

[workspace.lints.rust]
unused_crate_dependencies = "warn"

[profile.dev]
opt-level = 3
debug = "none"
codegen-units = 16

[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"
strip = true
lto = "thin"
panic = "abort"  # The panic hook logs and exits anyway, so unwinding buys nothing.
codegen-units = 1

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }

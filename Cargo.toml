activity_indicator = { path = "crates/activity_indicator" }
assets = { path = "crates/assets" }
buffer_diff = { path = "crates/buffer_diff" }
clock = { path = "crates/clock" }
command_palette = { path = "crates/command_palette" }
control = { path = "crates/control" }
derive_refineable = { path = "crates/refineable/derive_refineable" }
diagnostics = { path = "crates/diagnostics" }
ed_actions = { path = "crates/ed_actions" }
editor = { path = "crates/editor" }
encoding_selector = { path = "crates/encoding_selector" }
file_content = { path = "crates/file_content" }
file_finder = { path = "crates/file_finder" }
file_icons = { path = "crates/file_icons" }
fs = { path = "crates/fs" }
fuzzy = { path = "crates/fuzzy" }
fuzzy_nucleo = { path = "crates/fuzzy_nucleo" }
git = { path = "crates/git" }
git_ui = { path = "crates/git_ui" }
git_ui_core = { path = "crates/git_ui_core" }
go_to_line = { path = "crates/go_to_line" }
gpui = { path = "crates/gpui", default-features = false }
gpui_apple = { path = "crates/gpui_apple" }
gpui_macos = { path = "crates/gpui_macos", default-features = false }
gpui_macros = { path = "crates/gpui_macros" }
gpui_shared_string = { path = "crates/gpui_shared_string" }
gpui_util = { path = "crates/gpui_util" }
icons = { path = "crates/icons" }
image_viewer = { path = "crates/image_viewer" }
language = { path = "crates/language" }
language_core = { path = "crates/language_core" }
language_selector = { path = "crates/language_selector" }
language_tools = { path = "crates/language_tools" }
languages = { path = "crates/languages" }
lsp = { path = "crates/lsp" }
lsp_command_selector = { path = "crates/lsp_command_selector" }
lsp_locations = { path = "crates/lsp_locations" }
lsp_types = { path = "crates/lsp_types" }
markdown = { path = "crates/markdown" }
markdown_preview = { path = "crates/markdown_preview" }
menu = { path = "crates/menu" }
mermaid = { path = "crates/mermaid" }
multi_buffer = { path = "crates/multi_buffer" }
notifications = { path = "crates/notifications" }
open_path_prompt = { path = "crates/open_path_prompt" }
outline_panel = { path = "crates/outline_panel" }
path = { path = "crates/path" }
paths = { path = "crates/paths" }
picker = { path = "crates/picker" }
project = { path = "crates/project" }
project_panel = { path = "crates/project_panel" }
project_symbols = { path = "crates/project_symbols" }
recent_projects = { path = "crates/recent_projects" }
refineable = { path = "crates/refineable" }
rope = { path = "crates/rope" }
scheduler = { path = "crates/scheduler" }
search = { path = "crates/search" }
settings = { path = "crates/settings" }
settings_content = { path = "crates/settings_content" }
snippet = { path = "crates/snippet" }
spell_check = { path = "crates/spell_check" }
sum_tree = { path = "crates/sum_tree" }
